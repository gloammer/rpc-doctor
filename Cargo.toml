[package]
name = "rpc-doctor"
version = "0.1.0"
edition = "2024"
description = "A read-only RPC diagnostic CLI for Ethereum and Solana"
repository = "https://github.com/gloammer/rpc-doctor"
publish = false

[dependencies]
alloy-primitives = { version = "1.7", default-features = false, features = ["std"] }
bs58 = "0.5"
clap = { version = "4.6", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tiny_http = "0.12"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
